name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web application & sync assets to Android
        run: |
          npm run build
          npx cap sync android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "=== JAVA_HOME Environment ==="
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set!"
            exit 1
          fi
          RAW_JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          JAVA_MAJOR_VERSION=$(echo "$RAW_JAVA_VERSION" | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          echo "Raw Java Version: $RAW_JAVA_VERSION"
          echo "Detected Java Major Version: $JAVA_MAJOR_VERSION"
          if [ -z "$JAVA_MAJOR_VERSION" ]; then
            echo "Error: Could not detect Java major version!"
            exit 1
          fi
          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java version must be 17 or higher (found version: $JAVA_MAJOR_VERSION)!"
            exit 1
          fi
          echo "Java environment verified successfully: version $JAVA_MAJOR_VERSION >= 17."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ -f ./debug.keystore ]; then
            echo "Temporary debug keystore verified."
          else
            echo "Error: Failed to create ./debug.keystore!"
            exit 1
          fi
          mkdir -p ~/.android
          cp ./debug.keystore ~/.android/debug.keystore

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew || true
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Locate and verify debug APK
        id: verify_apk
        run: |
          EXPECTED_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_TARGET=""

          if [ -f "$EXPECTED_PATH" ]; then
            APK_TARGET="$EXPECTED_PATH"
          else
            echo "Notice: $EXPECTED_PATH not found at exact location. Searching inside android/app/build/outputs/apk..."
            if [ -d "android/app/build/outputs/apk" ]; then
              echo "Discovered APK files inside android/app/build/outputs/apk:"
              DISCOVERED=$(find android/app/build/outputs/apk -type f -name "*.apk" ! -name "*androidTest*" ! -name "*release*" 2>/dev/null)
              echo "$DISCOVERED"
              APK_TARGET=$(echo "$DISCOVERED" | grep "app-debug.apk" | head -n 1)
              if [ -z "$APK_TARGET" ]; then
                APK_TARGET=$(echo "$DISCOVERED" | head -n 1)
              fi
            fi
          fi

          if [ -z "$APK_TARGET" ] || [ ! -f "$APK_TARGET" ]; then
            echo "Error: Expected debug APK does not exist!"
            exit 1
          fi

          if [ ! -s "$APK_TARGET" ]; then
            echo "Error: Target APK $APK_TARGET is empty (0 bytes)!"
            exit 1
          fi

          case "$APK_TARGET" in
            *.apk) ;;
            *) echo "Error: File $APK_TARGET does not have .apk extension!"; exit 1 ;;
          esac

          case "$APK_TARGET" in
            *app-debug.apk) ;;
            *) echo "Error: File $APK_TARGET is not a valid debug APK belonging to the app module!"; exit 1 ;;
          esac

          echo "Verified Debug APK successfully: $APK_TARGET ($(stat -c%s "$APK_TARGET") bytes)"
          echo "apk_path=$APK_TARGET" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_release
        run: |
          TMP_DIR=$(mktemp -d)
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9_-]/-/g')
          RELEASE_APK_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TARGET_ASSET_PATH="${TMP_DIR}/${RELEASE_APK_NAME}"

          cp "${{ steps.verify_apk.outputs.apk_path }}" "$TARGET_ASSET_PATH"

          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          echo "release_asset_path=$TARGET_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "release_apk_name=$RELEASE_APK_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI version..."
          gh --version

          ASSET_PATH="${{ steps.prep_release.outputs.release_asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset does not exist at $ASSET_PATH!"
            exit 1
          fi
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is empty!"
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Release asset is not a .apk file!"; exit 1 ;;
          esac

          TAG_NAME="${{ steps.prep_release.outputs.tag_name }}"
          TITLE="${{ steps.prep_release.outputs.release_title }}"

          NOTES_FILE="${RUNNER_TEMP:-/tmp}/release_notes.md"
          {
            echo "### 📱 Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo ""
            echo "This is an **automatically generated debug APK** built by **GitHub Actions**."
            echo ""
            echo "- **Workflow Run Number:** #${GITHUB_RUN_NUMBER}"
            echo "- **Run Attempt:** ${GITHUB_RUN_ATTEMPT}"
            echo "- **Source Commit SHA:** \`${GITHUB_SHA}\`"
            echo "- **Intended Purpose:** Testing and verification"
            echo "- **Notice:** Not a Play Store production release; signed with a temporary debug keystore."
            echo ""
            echo "Directly download the APK file from the **Assets** section below to install on your Android device."
          } > "$NOTES_FILE"

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always() && steps.verify_apk.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            TAG_NAME="${{ steps.prep_release.outputs.tag_name }}"
            RELEASE_VIEW=$(gh release view "$TAG_NAME" --json tagName,name,url)
            RELEASE_URL=$(echo "$RELEASE_VIEW" | jq -r .url)
            RELEASE_TITLE=$(echo "$RELEASE_VIEW" | jq -r .name)
            APK_NAME="${{ steps.prep_release.outputs.release_apk_name }}"

            echo "=================================================="
            echo "🎉 GitHub Release Published Successfully!"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $APK_NAME"
            echo "=================================================="
            echo "The APK is directly available under Release -> Assets."
            echo "The Actions workflow artifact 'app-debug-apk' is also available."

            echo "## 🚀 Android Debug APK Download" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Your Android debug APK is ready for download!" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release:** [$RELEASE_TITLE]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`$TAG_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Download:** Open the link above and tap **\`$APK_NAME\`** under **Assets**." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact:** \`app-debug-apk\` (available on this workflow run summary)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "=================================================="
            echo "⚠️ Notice: GitHub Release publishing failed or was skipped."
            echo "However, the APK build succeeded completely!"
            echo "The debug APK remains available as the GitHub Actions artifact: app-debug-apk"
            echo "=================================================="

            echo "## ⚠️ Debug APK Built (Artifact Available)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The Android debug APK was successfully compiled and verified." >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub Release publishing did not complete, but the APK artifact is preserved:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact Name:** \`app-debug-apk\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- You can download it directly from the **Artifacts** section at the top of this GitHub Actions run." >> "$GITHUB_STEP_SUMMARY"
          fi
